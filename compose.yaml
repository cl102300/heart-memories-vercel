services:
  heart-memories:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      COOKIE_SECURE: "true"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:?Set BLOB_READ_WRITE_TOKEN in .env}
